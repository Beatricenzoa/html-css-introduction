<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tables</title>
<style>
    body{
        background: #b3b1b1;
    }
    table{
        border: 1px solid #0c0c0c;
        border-collapse: collapse;
        width: 60%;
        margin: auto ;
    }
    th{
        border: 1px solid #0c0c0c;
        padding-top: 10px;
        padding-bottom: 8px;
        text-align: center;
        background: gray;
        color: white;
        padding-left: 8px;
    }
    td{
        border: 1px solid #0c0c0c;
        padding: 10px;
    }
    .dob{
        color: #89ecec;
    }
</style>
</head>

<body>

<table>
    <thead>
        <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>DOB</th>
            <th>Gender</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Jane</td>
            <td>Doe</td>
            <td>jane@yahoo.com</td>
            <td class="dob">19-10-2008</td>
            <td>F</td>
        </tr>
        <tr>
            <td>Jill</td>
            <td>Jack</td>
            <td>jack@yahoo.com</td>
            <td class="dob">19-12-2018</td>
            <td>M</td>
        </tr> 
        <tr>
            <td>Doe</td>
            <td>John</td>
            <td>john@yahoo.com</td>
            <td class="dob">19-05-2005</td>
            <td>M</td>
        </tr>
        <tr>
            <td>Doe</td>
            <td>Jane</td>
            <td>jane@yahoo.com</td>
            <td class="dob">19-10-2008</td>
            <td>F</td>
        </tr>
        
    </tbody>
</table>
</html>
